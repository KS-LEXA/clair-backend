[project]
name = "clair-backend"
version = "0.1.0"
description = "FastAPI backend for Clair contract analyzer"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115.0",
  "uvicorn[standard]>=0.34.0",
  "pydantic>=2.10.0",
  "sqlalchemy>=2.0.0",
  "pymysql>=1.1.0",
  "python-multipart>=0.0.20"
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
