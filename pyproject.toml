[project]
name = "clair-backend"
version = "0.1.0"
description = "FastAPI backend for Clair contract analyzer"
requires-python = ">=3.9"
dependencies = [
  "fastapi>=0.115.0",
  "uvicorn[standard]>=0.30.0",
  "pydantic>=2.10.0",
  "pydantic-settings>=2.0.0",
  "sqlalchemy>=2.0.0",
  "pymysql>=1.1.0",
  "cryptography>=41.0.0",
  "python-multipart>=0.0.9",
  "python-dotenv>=1.0.0",
  "python-jose[cryptography]>=3.3.0",
  "passlib[bcrypt]>=1.7.4",
  "pydantic[email]>=2.0.0",
  "aiofiles>=24.0.0",
  "httpx>=0.27.0",
  "alembic>=1.13.0",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
